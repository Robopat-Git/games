<!--
==========================================================================
 THRASH TALK FIGHT  -  single-file HTML5 arcade fighting game
==========================================================================
 An original 2D fighter. Play as JESSC, a cartoon street fighter with big
 wavy dark hair, a rainbow-striped gym tank top, leopard-print yoga pants,
 sneakers and a big grocery bag (baguette and leek included) slung over her
 shoulder. She shouts "HAIYAAAA!" on every super. Beat three cartoon parody
 bosses (Boss Orange, Boss Blue and Zelenskid), best of three rounds each.
 Then the TRUE FINAL BOSS, MUSK, walks out at the Star Port: Starlink
 Strikes (20%), Starship Poop (40%), Robo-Rush (20%) and an Awkward Robot
 Dance (50%). He regenerates to full every 10 seconds and cannot be KO'd;
 survive as long as you can. That single round ends the game with a thank-you
 card from Patrick. All graphics, music and sound are generated in code. The
 only embedded assets are two small photos (base64 data URIs), and nothing is
 fetched from the network.

 CONTROLS (keyboard)
   Arrow toward the boss   walk forward
   Arrow away from boss    does nothing (there is no walking backwards)
   D             back-jump (hop away from the boss, costs 3% of your health)
   Up            jump          Down     crouch
   Z             punch         X        kick
   C             fireball (costs 3% of your health)   Space  block (hold)
   SUPERS: a POWER bar under your health fills from empty in 5 seconds.
     When it flashes SUPER READY, your next attack becomes a super:
     Z = MUSKY ATTACK (a grey electric crossover rams the boss, 28%)
     X = RAINBOW BEAM (screen-wide rainbow laser: 40% of Boss Orange's bar,
         5% of Boss Blue's bar, 5% vs the others)
     C = R32 THUNDER RAM (a boxy 90s turbo coupe rams the boss, 40%)
     Supers cost no health, can be blocked for 20% chip, and the bar
     starts empty again every round.
   Down+Z / Down+X   low punch / sweep kick
   Enter         start / continue
   P or Esc      pause         M        mute / unmute music and sound
 BOSS HEALTH: +25% per stage (stage 2 = 1.25x, stage 3 = 1.5625x the stage-1 boss).
   Your hits on bosses are fixed amounts based on the stage-1 boss's health, so
   later bosses take longer to beat. Zelenskid takes 10% less from supers.
 DAMAGE: punch/kick 8%, fireball hit 5% (of your max health when you are hit,
   of the stage-1 boss's health when you hit a boss),
   Zelenskid's falling missiles 25% (dodge them!). Self-costs (fireball,
   back-jump) never take you below 1 HP.
 TOUCH (phones/tablets): on-screen buttons show up automatically: Up (jump),
   Down (crouch) and one Forward arrow that always points at the boss (no back
   arrow), a P / F / K row (punch, fireball, kick), and B (block) and D
   (back-jump) above it. Tap the screen to start or continue.

 HOW TO SHARE / HOST
   - Email: attach this one .html file. The recipient opens it in a browser.
   - WhatsApp/Telegram: send it as a "Document". It opens in the phone browser.
   - Web: upload this one file to any static host (Netlify Drop, GitHub
     Pages, Vercel, itch.io as an HTML game, or any web server). You can
     rename it to index.html.
   - Offline: double-click the file. It needs no internet.
==========================================================================
-->
