<!--
==========================================================================
 THRASH TALK FIGHT  -  single-file HTML5 arcade fighting game
==========================================================================
 An original 2D fighter. Play as KAI, a silver-haired street monk in a
 sleeveless teal-and-gold fighting jacket with fingerless gloves, a gold
 sash and a glowing blue arm tattoo. Beat three cartoon parody bosses
 (Boss Orange, Boss Blue, and the final boss Zelenskid). Each stage is best
 of three rounds. All graphics, music and sound are generated in code. The
 only embedded asset is the small Sensei Patrick photo (a base64 data URI),
 and nothing is fetched from the network.

 CONTROLS (keyboard)
   Arrow toward the boss   walk forward
   Arrow away from boss    does nothing (there is no walking backwards)
   D             back-jump (hop away from the boss, costs 3% of your health)
   Up            jump          Down     crouch
   Z             punch         X        kick
   C             fireball (costs 3% of your health)   Space  block (hold)
   SUPERS: a POWER bar under your health fills from empty in 5 seconds.
     When it flashes SUPER READY, your next attack becomes a super:
     Z = VOLT RUSH (an electric crossover rams the boss, 28%)
     X = RAINBOW BEAM (screen-wide rainbow laser, 5%)
     C = R32 THUNDER RAM (a boxy 90s turbo coupe rams the boss, 40%)
     Supers cost no health, can be blocked for 20% chip, and the bar
     starts empty again every round.
   Down+Z / Down+X   low punch / sweep kick
   Enter         start / continue
   P or Esc      pause         M        mute / unmute music and sound
 BOSS HEALTH: +25% per stage (stage 2 = 1.25x, stage 3 = 1.5625x the stage-1 boss).
   Your hits on bosses are fixed amounts based on the stage-1 boss's health, so
   later bosses take longer to beat. Zelenskid takes 10% less from supers.
 DAMAGE: punch/kick 8%, fireball hit 5% (of your max health when you are hit,
   of the stage-1 boss's health when you hit a boss),
   Zelenskid's falling missiles 25% (dodge them!). Self-costs (fireball,
   back-jump) never take you below 1 HP.
 TOUCH (phones/tablets): on-screen buttons show up automatically: Up (jump),
   Down (crouch) and one Forward arrow that always points at the boss (no back
   arrow), a P / K / F row (punch, kick, fireball), and B (block) and D
   (back-jump) above it. Tap the screen to start or continue.

 HOW TO SHARE / HOST
   - Email: attach this one .html file. The recipient opens it in a browser.
   - WhatsApp/Telegram: send it as a "Document". It opens in the phone browser.
   - Web: upload this one file to any static host (Netlify Drop, GitHub
     Pages, Vercel, itch.io as an HTML game, or any web server). You can
     rename it to index.html.
   - Offline: double-click the file. It needs no internet.
==========================================================================
-->

 RS=Math.max(1,Math.min(2,s*(window.devicePixelRatio||1)));cv.width=Math.round(W*RS);cv.height=Math.round(H*RS);}

function mulberry(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function shade(h,a){const[r,g,b]=hex2rgb(h);const f=a<0?(v=>v*(1+a)):(v=>v+(255-v)*a);return'#'+[r,g,b].map(v=>('0'+(f(v)|0).toString(16)).slice(-2)).join('')}
function rgba(h,a){const[r,g,b]=hex2rgb(h);return`rgba(${r},${g},${b},${a})`}

 g.addColorStop(0,rgba(col,1));g.addColorStop(.22,rgba(col,.55));g.addColorStop(.55,rgba(col,.15));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.fillRect(0,0,s,s);return glowCache[col]=c0}

/* ---------------- AUDIO (procedural WebAudio) ---------------- */
let AC=null,MG=null,NB=null,muted=false;
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=muted?0:.45;MG.connect(AC.destination);
 const len=AC.sampleRate;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
 if(AC&&AC.state==='suspended')AC.resume()}
function env(g,t0,a,dur,vol){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur)}
function tone(f1,f2,dur,type,vol,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';
 o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);env(g,t,0.005,dur,vol||.2);o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+0.05)}
function noise(dur,vol,freq,type,delay,f2){if(!AC||muted)return;const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
 s.buffer=NB;s.loop=true;f.type=type||'lowpass';f.frequency.setValueAtTime(freq||1500,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+dur);env(g,t,0.003,dur,vol||.3);
 s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05)}

 clash(){noise(.4,.5,3000,'bandpass',0,300);tone(600,80,.4,'triangle',.3)},

 tc.querySelectorAll('.tb').forEach(b=>{const k=b.dataset.k;
  const dn=e=>{e.preventDefault();initAudio();kd(k);b.classList.add('on');if(['KeyZ','KeyX','KeyC','Space'].includes(k))tapped=true};

/* ---------------- POSES (procedural skeletal animation) ---------------- */
function winPose(f,P){const t=f.anim,b=Math.sin(t*.12);P.hy=6+b*2;
 switch(f.key){
  case 'kai':P.fh=[6,-60+b*3];P.bh=[16,-8];P.lean=-.05;break;
  case 'orange':P.fh=[26,-50+b*4];P.bh=[-22,-48-b*4];P.lean=-.08;P.expr=3;break;
  case 'blue':P.fh=[20+Math.sin(t*.3)*8,-62];P.bh=[-12,44];P.lean=-.03;P.expr=3;break;
  default:P.fh=[18,-46+b*6];P.bh=[14,-8];P.lean=.02;P.expr=3}}
function poseMove(f,P){const m=f.move,t=f.t,n=m.name,g=f.d.guard;let p;
 if(t<=m.st)p=t/m.st;else if(t<=m.st+m.ac)p=1;else p=m.rc?Math.max(0,1-(t-m.st-m.ac)/m.rc):1;
 const crouch=()=>{P.hy=36;P.lean=.28;P.ff=[26,0];P.bf=[-24,0]};
 switch(n){
 case 'punch':P.fh=[lerp(g[0],64,p),lerp(g[1],-8,p)];P.bh=[lerp(g[2],2,p),lerp(g[3],4,p)];P.lean=.08+.18*p;P.hx=-2+8*p;P.ff=[22+6*p,0];break;
 case 'cpunch':crouch();P.fh=[lerp(g[0],62,p),lerp(g[1]+4,8,p)];P.bh=[g[2]-4,g[3]+6];break;
 case 'kick':P.bf=[-16,0];P.fl=[lerp(.4,1.68,p),lerp(.1,1.5,p)];P.lean=lerp(.08,-.32,p);P.fh=[lerp(g[0],8,p),g[1]-6];P.bh=[lerp(g[2],-24,p),lerp(g[3],-4,p)];P.hy=4;break;
 case 'ckick':P.hy=44;P.lean=lerp(.28,.12,p);P.bf=[-20,0];P.fl=[lerp(.9,1.55,p),lerp(-.2,1.6,p)];P.fh=[18,-6];P.bh=[4,4];break;
 case 'jkick':P.fl=[lerp(.9,1.5,p),lerp(-.3,1.35,p)];P.bl=[.5,-.9];P.lean=-.15*p;P.fh=[g[0]-4,g[1]-12];P.bh=[g[2]-8,g[3]-10];P.hy=0;break;
 case 'super':P.fh=[lerp(g[0],54,p),lerp(g[1],-62,p)];P.bh=[lerp(g[2],-34,p),lerp(g[3],-30,p)];P.lean=lerp(.08,-.12,p);P.ff=[26,0];P.bf=[-26,0];P.hy=6;break;
 case 'fire':if(t<=m.st){const q=t/m.st;P.fh=[lerp(g[0],-8,q),lerp(g[1],4,q)];P.bh=[lerp(g[2],-14,q),lerp(g[3],8,q)];P.lean=lerp(.08,-.06,q);P.hy=12}
  else{P.fh=[lerp(g[0],60,p),lerp(g[1],-4,p)];P.bh=[lerp(g[2],56,p),lerp(g[3],4,p)];P.lean=.08+.18*p;P.hx=6*p;P.ff=[28,0];P.bf=[-24,0];P.hy=12}break;
 case 'rush':if(t<=m.st){P.hy=24;P.lean=.35;P.fh=[-10,10];P.bh=[-18,8];P.ff=[28,0];P.bf=[-30,0]}
  else if(t<=m.st+m.ac){const ph=t*.6,s=Math.sin(ph),c=Math.cos(ph);P.lean=.55;P.hy=14;P.ff=[30+s*18,-Math.max(0,c)*12];P.bf=[-10-s*18,-Math.max(0,-c)*12];P.fh=[18,-18];P.bh=[-22,10]}
  else{P.lean=.2*p;P.hy=12}break;
 case 'upper':if(t<=m.st){P.hy=26;P.lean=.2;P.fh=[6,6];}else{P.fl=[1.2,-.4];P.bl=[.1,.1];P.fh=[14,-66];P.bh=[8,4];P.lean=-.1;P.hy=0}break;
 case 'summon':P.fh=[8,-66];P.bh=[20,-10];P.lean=-.12;P.expr=3;P.hy=4;break;
 case 'barrage':{P.ff=[30,0];P.bf=[-28,0];P.hy=14;P.lean=.22;if(t>m.st&&t<=m.st+m.ac){const a=Math.floor(t/3)%2;P.fh=a?[62,-8+(t%5)]:[24,-14];P.bh=a?[20,-8]:[58,-2-(t%4)];}else{P.fh=[g[0],g[1]];P.bh=[g[2],g[3]]}break}
 }}
function pose(f){const d=f.d,t=f.anim,st=f.st,ft=f.t,g=d.guard,br=Math.sin(t*.09);
 const P={hx:-2,hy:8+br*1.5,lean:.08,ff:[22,0],bf:[-22,0],fh:[g[0],g[1]+br*2],bh:[g[2],g[3]+br*2],rot:0,drop:0,tilt:0,expr:0};
 switch(st){
 case 'walk':{const ph=t*.2*(d.speed/3.8),s=Math.sin(ph),c=Math.cos(ph);P.ff=[22+s*16,-Math.max(0,c)*9];P.bf=[-22-s*16,-Math.max(0,-c)*9];P.hy=6+Math.abs(c)*3;P.fh=[g[0]+s*3,g[1]];P.bh=[g[2]-s*3,g[3]];break}
 case 'crouch':P.hy=36;P.lean=.28;P.ff=[26,0];P.bf=[-24,0];P.fh=[g[0],g[1]+4];P.bh=[g[2],g[3]+4];break;
 case 'block':if(f.crouching){P.hy=36;P.lean=.2;P.ff=[26,0];P.bf=[-24,0]}else{P.hy=10;P.lean=-.04;P.ff=[20,0];P.bf=[-28,0]}P.fh=[18,-30];P.bh=[12,-26];P.hx=-4;if(f.bstun>0)P.hx=-8;break;
 case 'land':P.hy=22;break;
